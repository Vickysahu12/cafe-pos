# Render Blueprint — BillRaw backend (api.billraw.in)
# ─────────────────────────────────────────────────────────
# ADDED (2026-09-30). Render dashboard → New → Blueprint → is repo ko select karo,
# Render yeh file padh ke service bana dega. Secrets (sync: false) Render khud
# poochega — unhe Render dashboard mein hi daalna, kabhi code/chat mein nahi.
# Poori guide: D:\cafe-pos\docs\LAUNCH_PLAN.md §4.3
services:
  - type: web
    name: billraw-api
    runtime: node
    region: singapore          # Neon DB bhi Singapore (ap-southeast-1) mein hai — kam latency
    # TEMP (2026-09-30): abhi "free" — card baad mein. ⚠️ Pehle PAYING cafe se PEHLE
    # "starter" pe switch karna: free plan 15 min idle pe so jaata hai (pehli request
    # ~50 sec, KDS socket toot-ta hai). Switch karte waqt neeche ka TEMP bhi wapas karna.
    plan: free
    branch: main
    autoDeploy: true
    # Monorepo: sirf backend ya shared code badle tab redeploy — mobile/web ki
    # UI changes pe backend bina wajah restart na ho (live cafes ke sockets tootte hain)
    buildFilter:
      paths:
        - apps/backend/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    # --prod=false: NODE_ENV=production hone pe pnpm devDependencies (typescript,
    # prisma CLI) skip kar deta hai aur build fail hota — isliye zabardasti install.
    # TEMP (2026-09-30): free plan pe preDeployCommand allowed nahi, isliye migrations
    # (`db:deploy`) build ke end mein. Starter pe jaate hi wapas alag karna:
    #   buildCommand: ...build --filter=backend
    #   preDeployCommand: pnpm --filter backend db:deploy
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=backend && pnpm --filter backend db:deploy
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL        # Neon PRODUCTION pooled URL (hostname mein "-pooler")
        sync: false
      - key: DIRECT_URL          # Neon PRODUCTION direct URL (migrations ke liye)
        sync: false
      - key: JWT_ACCESS_SECRET   # naya random 96-char — dev wala copy MAT karna
        sync: false
      - key: JWT_REFRESH_SECRET  # alag naya random 96-char
        sync: false
      - key: RESEND_API_KEY      # Resend mein naya "billraw-production" key (Sending access, sirf billraw.in)
        sync: false
      - key: EMAIL_FROM
        value: no-reply@billraw.in
      - key: ALLOWED_ORIGINS     # customer QR site + landing page
        value: https://order.billraw.in,https://billraw.in,https://www.billraw.in
